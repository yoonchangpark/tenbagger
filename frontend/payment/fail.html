<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>결제 실패 — 텐배거 헌터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1a2332; border: 1px solid #ef444444; border-radius: 1rem; padding: 3rem; text-align: center; max-width: 420px; width: 90%; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; color: #ef4444; }
    p { color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.6; }
    .btn { display: inline-block; padding: 0.85rem 2rem; background: #1e3a5f; color: #60a5fa; border: 1px solid #3b82f6; border-radius: 0.5rem; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">😢</div>
  <h1>결제 실패</h1>
  <p id="msg">결제가 취소되었거나 오류가 발생했습니다.<br>다시 시도해주세요.</p>
  <a href="/pricing.html" class="btn">다시 시도하기</a>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const msg = params.get("message");
  if (msg) document.getElementById("msg").textContent = decodeURIComponent(msg);
</script>
</body>
</html>
