<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 재설정 · 텐배거 헌터</title>
  <!-- GA4: 아래 G-XXXXXXXXXX를 실제 GA4 측정 ID로 교체하세요 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer=window.dataLayer||[];
    function gtag(){dataLayer.push(arguments);}
    gtag('js',new Date());
    gtag('config','G-XXXXXXXXXX');
  </script>
  <style>
    :root {
      --bg:#0a0f1e; --surface:#111827; --surface2:#1f2937;
      --border:#374151; --text:#f9fafb; --muted:#9ca3af;
      --green:#10b981; --blue:#3b82f6; --red:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    header{padding:16px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(17,24,39,.9);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
    .logo{font-size:22px;font-weight:800;background:linear-gradient(135deg,#10b981,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
    .subtitle{font-size:12px;color:var(--muted);}
    .nav-link{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--muted);font-size:12px;font-weight:600;text-decoration:none;}

    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.5);}
    .card-title{font-size:22px;font-weight:800;margin-bottom:6px;text-align:center;}
    .card-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;line-height:1.6;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
    .form-group input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;}
    .form-group input:focus{border-color:var(--blue);}
    .btn-primary{width:100%;background:linear-gradient(135deg,#2563eb,#7c3aed);border:none;border-radius:10px;padding:13px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:opacity .2s;margin-top:8px;}
    .btn-primary:hover{opacity:.9;}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
    .msg{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;text-align:center;display:none;}
    .msg.success{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:#34d399;}
    .msg.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#f87171;}
    .back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--muted);}
    .back-link a{color:var(--blue);text-decoration:none;}
    .back-link a:hover{text-decoration:underline;}
  </style>
</head>
<body>
<header>
  <div>
    <a href="/index.html" class="logo">텐배거 헌터 🚀</a>
    <div class="subtitle">비밀번호 재설정</div>
  </div>
  <a href="/login.html" class="nav-link">로그인</a>
</header>

<div class="wrap">
  <div class="card">

    <!-- ① 이메일 요청 화면 (token 없음) -->
    <div id="viewRequest">
      <div class="card-title">🔑 비밀번호 찾기</div>
      <div class="card-sub">가입하신 이메일을 입력하면 재설정 링크를 보내드립니다.<br>이메일 로그인 계정만 지원합니다.</div>
      <div id="reqMsg" class="msg"></div>
      <div class="form-group">
        <label>이메일</label>
        <input id="reqEmail" type="email" placeholder="your@email.com" autocomplete="email" />
      </div>
      <button class="btn-primary" id="reqBtn" onclick="sendResetEmail()">재설정 링크 발송</button>
      <p class="back-link"><a href="/login.html">← 로그인으로 돌아가기</a></p>
    </div>

    <!-- ② 새 비밀번호 설정 화면 (token 있음) -->
    <div id="viewReset" style="display:none;">
      <div class="card-title">🔒 새 비밀번호 설정</div>
      <div class="card-sub">새 비밀번호를 입력해주세요. 6자 이상이어야 합니다.</div>
      <div id="resetMsg" class="msg"></div>
      <div class="form-group">
        <label>새 비밀번호</label>
        <input id="newPw" type="password" placeholder="6자 이상 입력" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label>비밀번호 확인</label>
        <input id="confirmPw" type="password" placeholder="동일하게 입력" autocomplete="new-password" />
      </div>
      <button class="btn-primary" id="resetBtn" onclick="submitReset()">비밀번호 변경</button>
      <p class="back-link"><a href="/login.html">← 로그인으로 돌아가기</a></p>
    </div>

  </div>
</div>

<script>
  const API = "";
  const token = new URLSearchParams(location.search).get("token");

  if (token) {
    document.getElementById("viewRequest").style.display = "none";
    document.getElementById("viewReset").style.display = "block";
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "msg " + type;
    el.style.display = "block";
  }

  async function sendResetEmail() {
    const email = document.getElementById("reqEmail").value.trim();
    if (!email) return;
    const btn = document.getElementById("reqBtn");
    btn.disabled = true;
    btn.textContent = "발송 중…";
    try {
      const r = await fetch(API + "/api/v2/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const d = await r.json();
      showMsg("reqMsg", d.message || "링크를 발송했습니다.", r.ok ? "success" : "error");
      if (r.ok) btn.textContent = "✅ 발송 완료";
      else { btn.disabled = false; btn.textContent = "재설정 링크 발송"; }
    } catch {
      showMsg("reqMsg", "네트워크 오류가 발생했습니다.", "error");
      btn.disabled = false;
      btn.textContent = "재설정 링크 발송";
    }
  }

  async function submitReset() {
    const newPw = document.getElementById("newPw").value;
    const confirmPw = document.getElementById("confirmPw").value;
    if (!newPw || newPw.length < 6) { showMsg("resetMsg", "비밀번호는 6자 이상이어야 합니다.", "error"); return; }
    if (newPw !== confirmPw) { showMsg("resetMsg", "비밀번호가 일치하지 않습니다.", "error"); return; }
    const btn = document.getElementById("resetBtn");
    btn.disabled = true;
    btn.textContent = "변경 중…";
    try {
      const r = await fetch(API + "/api/v2/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: newPw }),
      });
      const d = await r.json();
      if (r.ok) {
        showMsg("resetMsg", d.message, "success");
        btn.textContent = "✅ 변경 완료";
        setTimeout(() => { location.href = "/login.html"; }, 2000);
      } else {
        showMsg("resetMsg", d.detail || "오류가 발생했습니다.", "error");
        btn.disabled = false;
        btn.textContent = "비밀번호 변경";
      }
    } catch {
      showMsg("resetMsg", "네트워크 오류가 발생했습니다.", "error");
      btn.disabled = false;
      btn.textContent = "비밀번호 변경";
    }
  }

  // Enter 키 지원
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (!token) sendResetEmail();
    else submitReset();
  });
</script>
</body>
</html>
