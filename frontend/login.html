<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · 텐배거 헌터 🚀</title>
  <style>
    :root {
      --bg:#0a0f1e; --surface:#111827; --surface2:#1f2937;
      --border:#374151; --text:#f9fafb; --muted:#9ca3af;
      --green:#10b981; --blue:#3b82f6; --yellow:#f59e0b;
      --red:#ef4444; --purple:#8b5cf6; --kakao:#FEE500;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    header{padding:16px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(17,24,39,.9);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
    .logo{font-size:22px;font-weight:800;background:linear-gradient(135deg,#10b981,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
    .subtitle{font-size:12px;color:var(--muted);}
    .nav-link{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--muted);font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;transition:all .15s;}
    .nav-link:hover{border-color:var(--blue);color:#93c5fd;}

    /* ── 로그인 카드 ── */
    .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.5);}
    .card-title{font-size:24px;font-weight:800;margin-bottom:6px;text-align:center;}
    .card-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;}

    /* ── 탭 ── */
    .tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px;}
    .tab-btn{flex:1;padding:10px;background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
    .tab-btn.active{background:var(--surface2);color:var(--text);}

    /* ── 폼 ── */
    .form-group{margin-bottom:16px;}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;}
    input[type="email"],input[type="password"],input[type="text"]{
      width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
      padding:11px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;
    }
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);}
    input::placeholder{color:#6b7280;}

    /* ── 버튼 ── */
    .btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#2563eb,#7c3aed);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-top:4px;}
    .btn-primary:hover{opacity:.9;}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;}

    .btn-kakao{width:100%;padding:13px;background:var(--kakao);border:none;border-radius:10px;color:#181600;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .15s;margin-top:10px;}
    .btn-kakao:hover{opacity:.9;}
    .kakao-icon{width:22px;height:22px;background:#3C1E1E;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--kakao);}

    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

    /* ── 메시지 ── */
    .msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}
    .msg.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;}
    .msg.success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#34d399;}
    .msg.show{display:block;}
  </style>
</head>
<body>

<header>
  <div>
    <a class="logo" href="index.html">🚀 텐배거 헌터</a>
    <div class="subtitle">한국 주식 장기투자 분석 시스템</div>
  </div>
  <a class="nav-link" href="index.html">← 홈으로</a>
</header>

<div class="login-wrap">
  <div class="card">
    <div class="card-title">텐배거 헌터</div>
    <div class="card-sub">로그인하고 관심종목과 구독 서비스를 이용하세요</div>

    <!-- 오류/성공 메시지 -->
    <div id="msg" class="msg"></div>

    <!-- 로그인 / 회원가입 탭 -->
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">로그인</button>
      <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">회원가입</button>
    </div>

    <!-- ── 로그인 폼 ── -->
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" placeholder="비밀번호 입력" required />
      </div>
      <button type="submit" class="btn-primary" id="btnLogin">로그인</button>
    </form>

    <!-- ── 회원가입 폼 ── -->
    <form id="registerForm" style="display:none;" onsubmit="doRegister(event)">
      <div class="form-group">
        <label>이름 (선택)</label>
        <input type="text" id="regName" placeholder="홍길동" maxlength="30" />
      </div>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>비밀번호 <span style="color:var(--muted);font-weight:400;">(6자 이상)</span></label>
        <input type="password" id="regPassword" placeholder="비밀번호 입력 (6자 이상)" required minlength="6" />
      </div>
      <button type="submit" class="btn-primary" id="btnRegister">회원가입</button>
    </form>

    <div class="divider">또는</div>

    <!-- 카카오 로그인 -->
    <button class="btn-kakao" id="btnKakao" onclick="doKakaoLogin()">
      <span class="kakao-icon">K</span>
      카카오로 로그인
    </button>
  </div>
</div>

<script>
  const API = 'http://localhost:8000';

  /* ── 로그인 후 이동할 URL 결정 ────────────────────────────────── */
  function getRedirectUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('redirect') || 'index.html';
  }

  /* ── 카카오 콜백 토큰 처리 (URL 파라미터) ─────────────────────── */
  (function handleKakaoCallback() {
    const params = new URLSearchParams(window.location.search);
    const at = params.get('access_token');
    const rt = params.get('refresh_token');
    const name = params.get('name');
    if (at) {
      localStorage.setItem('access_token', at);
      if (rt) localStorage.setItem('refresh_token', rt);
      if (name) localStorage.setItem('user_name', decodeURIComponent(name));
      window.location.replace(getRedirectUrl());
    }
  })();

  /* ── 이미 로그인돼 있으면 redirect 또는 홈으로 ─────────────────── */
  if (localStorage.getItem('access_token')) {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    if (redirect) {
      window.location.replace(redirect);
    } else {
      window.location.replace('index.html');
    }
  }

  /* ── 탭 전환 ───────────────────────────────────────────────────── */
  function switchTab(tab) {
    const isLogin = (tab === 'login');
    document.getElementById('loginForm').style.display    = isLogin ? '' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabRegister').classList.toggle('active', !isLogin);
    hideMsg();
  }

  /* ── 메시지 표시 ───────────────────────────────────────────────── */
  function showMsg(text, type = 'error') {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = `msg ${type} show`;
  }
  function hideMsg() {
    document.getElementById('msg').className = 'msg';
  }

  /* ── 로그인 처리 ───────────────────────────────────────────────── */
  async function doLogin(e) {
    e.preventDefault();
    hideMsg();
    const btn = document.getElementById('btnLogin');
    btn.disabled = true; btn.textContent = '로그인 중…';

    try {
      const res = await fetch(`${API}/api/v2/auth/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value.trim(),
          password: document.getElementById('loginPassword').value,
        }),
      });

      const data = await res.json();
      if (!res.ok) {
        showMsg(data.detail || '로그인에 실패했습니다.', 'error');
        return;
      }

      // 토큰 저장
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      if (data.user?.name) localStorage.setItem('user_name', data.user.name);

      showMsg(`${data.user?.name || ''}님 환영합니다! 🎉`, 'success');
      setTimeout(() => window.location.replace(getRedirectUrl()), 800);

    } catch (err) {
      showMsg('서버 연결에 실패했습니다. API 서버가 실행 중인지 확인해주세요.', 'error');
    } finally {
      btn.disabled = false; btn.textContent = '로그인';
    }
  }

  /* ── 회원가입 처리 ─────────────────────────────────────────────── */
  async function doRegister(e) {
    e.preventDefault();
    hideMsg();
    const btn = document.getElementById('btnRegister');
    btn.disabled = true; btn.textContent = '가입 중…';

    try {
      const res = await fetch(`${API}/api/v2/auth/register`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: document.getElementById('regEmail').value.trim(),
          password: document.getElementById('regPassword').value,
          name: document.getElementById('regName').value.trim() || null,
        }),
      });

      const data = await res.json();
      if (!res.ok) {
        showMsg(data.detail || '회원가입에 실패했습니다.', 'error');
        return;
      }

      // 토큰 저장 후 바로 로그인 처리
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      if (data.user?.name) localStorage.setItem('user_name', data.user.name);

      showMsg('가입 완료! 잠시 후 이동합니다 🚀', 'success');
      setTimeout(() => window.location.replace(getRedirectUrl()), 900);

    } catch (err) {
      showMsg('서버 연결에 실패했습니다. API 서버가 실행 중인지 확인해주세요.', 'error');
    } finally {
      btn.disabled = false; btn.textContent = '회원가입';
    }
  }

  /* ── 카카오 로그인 ─────────────────────────────────────────────── */
  async function doKakaoLogin() {
    const btn = document.getElementById('btnKakao');
    btn.disabled = true; btn.querySelector('span + *') || (btn.lastChild.textContent = ' 연결 중…');

    try {
      // redirect 파라미터를 state로 전달해 카카오 OAuth 후 원래 페이지로 복귀
      const redirectPath = getRedirectUrl();
      const res = await fetch(`${API}/api/v2/auth/kakao?redirect=${encodeURIComponent(redirectPath)}`);
      const data = await res.json();

      if (!res.ok) {
        showMsg(data.detail || '카카오 로그인을 사용할 수 없습니다.', 'error');
        return;
      }
      // 카카오 인증 페이지로 이동
      window.location.href = data.url;

    } catch (err) {
      showMsg('서버 연결에 실패했습니다.', 'error');
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
