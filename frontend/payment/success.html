<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>결제 완료 — 텐배거 헌터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1a2332; border: 1px solid #34d39944; border-radius: 1rem; padding: 3rem; text-align: center; max-width: 420px; width: 90%; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; color: #34d399; }
    p { color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.6; }
    .btn { display: inline-block; padding: 0.85rem 2rem; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border-radius: 0.5rem; text-decoration: none; font-weight: 600; }
    .loading { color: #60a5fa; font-size: 0.9rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1>결제 완료!</h1>
  <p id="msg" class="loading">결제를 확인하는 중입니다...</p>
  <a href="/index.html" class="btn">분석 시작하기</a>
</div>

<script>
  const API = "";

  async function confirmPayment() {
    const params = new URLSearchParams(window.location.search);
    const paymentKey = params.get("paymentKey");
    const orderId = params.get("orderId");
    const amount = parseInt(params.get("amount"));
    const tier = params.get("tier");
    const token = localStorage.getItem("access_token");

    if (!paymentKey || !orderId || !amount || !tier) {
      document.getElementById("msg").textContent = "결제 정보가 없습니다.";
      return;
    }

    try {
      const res = await fetch(`${API}/api/v2/payment/confirm`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ paymentKey, orderId, amount, tier }),
      });

      const data = await res.json();
      if (res.ok) {
        document.getElementById("msg").textContent = `${data.message} 만료일: ${new Date(data.expires_at).toLocaleDateString("ko-KR")}`;
        document.getElementById("msg").style.color = "#34d399";
      } else {
        document.getElementById("msg").textContent = `오류: ${data.detail}`;
        document.getElementById("msg").style.color = "#ef4444";
      }
    } catch (e) {
      document.getElementById("msg").textContent = "네트워크 오류가 발생했습니다.";
    }
  }

  confirmPayment();
</script>
</body>
</html>
