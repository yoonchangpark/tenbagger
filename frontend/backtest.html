<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>백테스트 · 텐배거 헌터</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0f1e; --surface: #111827; --surface2: #1f2937;
      --border: #374151; --text: #f9fafb; --muted: #9ca3af;
      --green: #10b981; --blue: #3b82f6; --yellow: #f59e0b;
      --red: #ef4444; --purple: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Pretendard','Noto Sans KR',sans-serif; min-height: 100vh; }

    /* ── Header ── */
    header {
      padding: 16px 32px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(17,24,39,.9); position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(10px);
    }
    .logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg,#8b5cf6,#3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { display: flex; gap: 8px; }
    .nav-link { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; color: var(--muted); font-size: 12px; font-weight: 600; text-decoration: none; transition: all .15s; }
    .nav-link:hover, .nav-link.active { border-color: var(--blue); color: #93c5fd; }

    /* ── Main ── */
    .main { max-width: 1100px; margin: 36px auto 60px; padding: 0 24px; }

    /* ── 설정 카드 ── */
    .config-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 28px 32px; margin-bottom: 28px;
    }
    .config-card h2 { font-size: 16px; font-weight: 700; margin-bottom: 24px; }

    /* 탭: 개별 / 시장 */
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tab {
      padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      cursor: pointer; transition: all .15s;
    }
    .tab.active { background: rgba(59,130,246,.12); border-color: var(--blue); color: #93c5fd; }

    .config-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 16px; margin-bottom: 20px; }
    .config-group label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 6px; font-weight: 600; }
    .config-group input[type=text], .config-group select {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px;
      outline: none; transition: border-color .15s;
    }
    .config-group input:focus, .config-group select:focus { border-color: var(--blue); }

    /* 연도 버튼 */
    .year-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .year-btn {
      padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      cursor: pointer; transition: all .15s;
    }
    .year-btn.active { background: rgba(139,92,246,.15); border-color: var(--purple); color: #c4b5fd; }

    .run-btn {
      padding: 12px 36px; background: linear-gradient(135deg,#7c3aed,#2563eb);
      border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px;
      cursor: pointer; transition: opacity .15s;
    }
    .run-btn:hover { opacity: .85; }
    .run-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── 결과 ── */
    .loading-overlay { text-align: center; padding: 60px; }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(139,92,246,.2); border-top-color: #a78bfa; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 요약 통계 */
    .summary-banner {
      background: linear-gradient(135deg,rgba(139,92,246,.1),rgba(59,130,246,.08));
      border: 1px solid rgba(139,92,246,.25); border-radius: 16px;
      padding: 24px 28px; margin-bottom: 24px;
    }
    .summary-banner h3 { font-size: 14px; color: var(--muted); margin-bottom: 16px; font-weight: 600; }
    .grade-summary-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 14px; }
    .grade-summary-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px;
    }
    .grade-summary-card .gs-grade { font-size: 11px; font-weight: 700; margin-bottom: 8px; }
    .grade-summary-card .gs-avg { font-size: 24px; font-weight: 800; }
    .grade-summary-card .gs-tb { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* 개별 결과 */
    .single-result {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px 32px; margin-bottom: 24px;
    }
    .single-result h3 { font-size: 15px; font-weight: 700; margin-bottom: 20px; }
    .result-compare {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;
    }
    .compare-box { background: var(--surface2); border-radius: 12px; padding: 18px 20px; }
    .compare-box .c-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
    .compare-box .c-year { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .compare-box .c-price { font-size: 18px; font-weight: 700; color: var(--muted); }
    .compare-box .c-grade { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }

    .return-banner {
      text-align: center; padding: 20px;
      background: var(--surface2); border-radius: 12px; margin-bottom: 24px;
    }
    .return-val { font-size: 48px; font-weight: 800; }
    .return-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .correctness-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; }
    .correct { background: rgba(16,185,129,.15); color: #10b981; border: 1px solid rgba(16,185,129,.3); }
    .incorrect { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3); }

    /* 산점도 */
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    .chart-card h3 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 16px; }

    /* 상세 테이블 */
    .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 24px; }
    .table-card h3 { font-size: 13px; color: var(--muted); padding: 16px 20px; border-bottom: 1px solid var(--border); font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { padding: 10px 14px; text-align: right; color: var(--muted); font-size: 11px; font-weight: 600; border-bottom: 1px solid var(--border); background: var(--surface2); }
    th:first-child { text-align: left; }
    td { padding: 10px 14px; text-align: right; border-bottom: 1px solid rgba(55,65,81,.4); }
    td:first-child { text-align: left; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    .pos { color: var(--green); } .neg { color: var(--red); }
    .grade-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; }
    .grade-TENBAGGER { background: rgba(16,185,129,.15); color: #10b981; }
    .grade-COMPOUNDER { background: rgba(59,130,246,.15); color: #60a5fa; }
    .grade-WATCHLIST { background: rgba(245,158,11,.15); color: #fbbf24; }
    .grade-AVOID { background: rgba(239,68,68,.15); color: #f87171; }

    .empty-state { text-align: center; padding: 60px; color: var(--muted); }
    .empty-state .e-icon { font-size: 48px; margin-bottom: 12px; }

    @media (max-width: 640px) {
      .result-compare { grid-template-columns: 1fr; }
      .grade-summary-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">🧪 백테스트</div>
  </div>
  <div class="nav-links">
    <a class="nav-link" href="index.html">🚀 종목분석</a>
    <a class="nav-link" href="screener.html">📊 스크리너</a>
    <a class="nav-link active" href="backtest.html">🧪 백테스트</a>
  </div>
</header>

<div class="main">

  <!-- ── 설정 카드 ── -->
  <div class="config-card">
    <h2>🧪 백테스트 설정</h2>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('single', this)">📌 개별 종목</button>
      <button class="tab" onclick="switchTab('market', this)">🌏 시장 전체</button>
    </div>

    <div id="tabSingle">
      <div class="config-row">
        <div class="config-group">
          <label>종목코드 또는 기업명</label>
          <input type="text" id="btTicker" placeholder="예: 005930 또는 삼성전자" value="" />
        </div>
        <div class="config-group">
          <label>분석 기준 연도</label>
          <div class="year-btns" id="yearBtns">
            <button class="year-btn" data-year="2012" onclick="selectYear(this)">2012</button>
            <button class="year-btn" data-year="2013" onclick="selectYear(this)">2013</button>
            <button class="year-btn" data-year="2014" onclick="selectYear(this)">2014</button>
            <button class="year-btn active" data-year="2015" onclick="selectYear(this)">2015</button>
            <button class="year-btn" data-year="2016" onclick="selectYear(this)">2016</button>
            <button class="year-btn" data-year="2017" onclick="selectYear(this)">2017</button>
            <button class="year-btn" data-year="2018" onclick="selectYear(this)">2018</button>
            <button class="year-btn" data-year="2019" onclick="selectYear(this)">2019</button>
          </div>
        </div>
        <div class="config-group">
          <label>보유 기간</label>
          <select id="btHoldYears">
            <option value="3">3년</option>
            <option value="5" selected>5년</option>
            <option value="7">7년</option>
            <option value="10">10년</option>
          </select>
        </div>
      </div>
    </div>

    <div id="tabMarket" style="display:none">
      <div class="config-row">
        <div class="config-group">
          <label>분석 기준 연도</label>
          <div class="year-btns" id="mYearBtns">
            <button class="year-btn" data-year="2012" onclick="selectMYear(this)">2012</button>
            <button class="year-btn" data-year="2013" onclick="selectMYear(this)">2013</button>
            <button class="year-btn active" data-year="2014" onclick="selectMYear(this)">2014</button>
            <button class="year-btn" data-year="2015" onclick="selectMYear(this)">2015</button>
            <button class="year-btn" data-year="2016" onclick="selectMYear(this)">2016</button>
            <button class="year-btn" data-year="2017" onclick="selectMYear(this)">2017</button>
          </div>
        </div>
        <div class="config-group">
          <label>보유 기간</label>
          <select id="btMHoldYears">
            <option value="3">3년</option>
            <option value="5" selected>5년</option>
            <option value="7">7년</option>
          </select>
        </div>
        <div class="config-group">
          <label>분석 종목 수 (DB에 저장된 것 기준)</label>
          <select id="btMLimit">
            <option value="30">30개</option>
            <option value="50" selected>50개</option>
            <option value="100">100개</option>
          </select>
        </div>
      </div>
      <div style="font-size:11px;color:#4b5563;margin-bottom:16px;line-height:1.7;">
        💡 시장 전체 백테스트는 ETL 실행 후 DB에 저장된 종목을 대상으로 합니다.<br>
        DART 재호출이 필요해 <strong style="color:#6b7280">약 5~20분</strong> 소요될 수 있습니다.
      </div>
    </div>

    <button class="run-btn" id="runBtn" onclick="runBacktest()">🧪 백테스트 실행</button>
  </div>

  <!-- ── 결과 영역 ── -->
  <div id="resultArea">
    <div class="empty-state">
      <div class="e-icon">🧪</div>
      <p style="color:#4b5563;font-size:14px;line-height:1.8">
        "10년 전에 이 시스템을 썼다면 실제로 텐배거를 발굴했을까?"<br>
        과거 기준 재무 스코어링 → 실제 이후 수익률 비교 검증
      </p>
    </div>
  </div>

</div>

<script>
  const API = "";
  let currentTab = "single";
  let selectedYear = 2015;
  let selectedMYear = 2014;

  function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tabSingle").style.display = tab === "single" ? "" : "none";
    document.getElementById("tabMarket").style.display = tab === "market" ? "" : "none";
  }

  function selectYear(btn) {
    document.querySelectorAll("#yearBtns .year-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedYear = parseInt(btn.dataset.year);
  }

  function selectMYear(btn) {
    document.querySelectorAll("#mYearBtns .year-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedMYear = parseInt(btn.dataset.year);
  }

  async function runBacktest() {
    const btn = document.getElementById("runBtn");
    btn.disabled = true; btn.textContent = "분석 중...";
    document.getElementById("resultArea").innerHTML = `
      <div class="loading-overlay">
        <div class="spinner"></div>
        <div style="color:#a78bfa;font-size:14px;font-weight:600">백테스트 실행 중...</div>
        <div style="color:#4b5563;font-size:12px;margin-top:6px">DART 과거 재무데이터 수집 중 (약 30초~수분 소요)</div>
      </div>`;

    try {
      if (currentTab === "single") {
        const ticker = document.getElementById("btTicker").value.trim();
        if (!ticker) throw new Error("종목코드 또는 기업명을 입력해 주세요.");
        const holdYears = document.getElementById("btHoldYears").value;
        const res = await fetch(`${API}/api/backtest/${encodeURIComponent(ticker)}?base_year=${selectedYear}&hold_years=${holdYears}`);
        if (!res.ok) throw new Error((await res.json()).detail);
        const btData = await res.json();
        renderSingleResult(btData);
        loadBacktestExplanation(btData);
      } else {
        const holdYears = document.getElementById("btMHoldYears").value;
        const limit = document.getElementById("btMLimit").value;
        const res = await fetch(`${API}/api/backtest/market?base_year=${selectedMYear}&hold_years=${holdYears}&limit=${limit}`);
        if (!res.ok) throw new Error((await res.json()).detail);
        renderMarketResult(await res.json());
      }
    } catch (e) {
      document.getElementById("resultArea").innerHTML = `
        <div class="empty-state"><div class="e-icon">⚠️</div><p style="color:#f87171">${e.message}</p></div>`;
    } finally {
      btn.disabled = false; btn.textContent = "🧪 백테스트 실행";
    }
  }

  function gradeColor(g) {
    return { TENBAGGER: "#10b981", COMPOUNDER: "#60a5fa", WATCHLIST: "#fbbf24", AVOID: "#f87171" }[g] || "#9ca3af";
  }

  function renderSingleResult(d) {
    const sc = d.score_at_base_year;
    const ret = d.actual_return_pct;
    const retColor = ret == null ? "#9ca3af" : ret >= 0 ? "#10b981" : "#ef4444";
    const retStr = ret == null ? "데이터 없음" : `${ret >= 0 ? "+" : ""}${ret.toFixed(1)}%`;
    const isTB = d.is_tenbagger_actual;

    const correctEl = d.prediction_correct == null ? "" :
      d.prediction_correct
        ? `<span class="correctness-badge correct">✅ 예측 적중</span>`
        : `<span class="correctness-badge incorrect">❌ 예측 빗나감</span>`;

    const gradeLabel = { TENBAGGER: "⭐ 텐배거 후보", COMPOUNDER: "🟢 우량 성장주", WATCHLIST: "🟡 관심 종목", AVOID: "🔴 회피" };

    document.getElementById("resultArea").innerHTML = `
      <div class="single-result">
        <h3>📌 ${d.ticker} 개별 백테스트 결과
          <span style="font-size:12px;color:#6b7280;font-weight:400;margin-left:8px">${d.base_year}년 → ${d.end_year}년 (${d.hold_years}년 보유)</span>
        </h3>

        <div class="result-compare">
          <div class="compare-box">
            <div class="c-label">📊 ${d.base_year}년 기준 스코어</div>
            <div class="c-year" style="color:${gradeColor(sc.grade)}">${sc.total_score ?? "-"} 점</div>
            <div class="c-price">재무 데이터 ${d.historical_financials_count}년치 사용</div>
            <span class="c-grade grade-${sc.grade}" style="background:rgba(0,0,0,.2);border:1px solid ${gradeColor(sc.grade)}33;color:${gradeColor(sc.grade)}">${gradeLabel[sc.grade] || sc.grade}</span>
          </div>
          <div class="compare-box">
            <div class="c-label">📈 실제 수익률</div>
            <div class="c-year" style="color:${retColor}">${retStr}</div>
            <div class="c-price">
              ${d.price_at_base_year ? `${d.base_year}년 ₩${d.price_at_base_year.toLocaleString()}` : "주가 없음"}
              ${d.price_at_end_year ? ` → ${d.end_year}년 ₩${d.price_at_end_year.toLocaleString()}` : ""}
            </div>
            ${isTB ? `<span class="c-grade" style="background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#10b981">⭐ 실제 텐배거!</span>` : ""}
          </div>
        </div>

        <div style="text-align:center;margin-bottom:20px;">
          <div class="return-val" style="color:${retColor}">${retStr}</div>
          <div class="return-label">${d.hold_years}년간 실제 수익률 ${isTB ? "· ⭐ 텐배거 달성!" : ""}</div>
          <div style="margin-top:12px">${correctEl}</div>
        </div>

        <!-- 카테고리 점수 상세 -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">
          ${[
            { label:"성장성", key:"growth_score", color:"#10b981" },
            { label:"안정성", key:"stability_score", color:"#3b82f6" },
            { label:"현금흐름", key:"cashflow_score", color:"#8b5cf6" },
            { label:"배당정책", key:"dividend_score", color:"#f59e0b" },
            { label:"일관성", key:"consistency_score", color:"#ec4899" },
          ].map(c => `
            <div style="background:var(--surface2);border-radius:10px;padding:14px;text-align:center">
              <div style="font-size:10px;color:#6b7280;margin-bottom:4px">${c.label}</div>
              <div style="font-size:20px;font-weight:800;color:${c.color}">${sc[c.key]?.toFixed(1) ?? "-"}</div>
            </div>`).join("")}
        </div>

        <!-- AI 설명 박스 (비동기 로드) -->
        <div id="aiExplainBox" style="margin-top:20px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.2);border-radius:12px;padding:18px;display:none">
          <div style="font-size:12px;color:#a78bfa;font-weight:700;margin-bottom:10px">🤖 AI 백테스트 분석</div>
          <div id="aiExplainText" style="font-size:13px;color:#d1d5db;line-height:1.7;white-space:pre-wrap"></div>
        </div>
      </div>`;
  }

  async function loadBacktestExplanation(d) {
    const box = document.getElementById("aiExplainBox");
    const txt = document.getElementById("aiExplainText");
    if (!box || !txt) return;
    box.style.display = "block";
    txt.textContent = "AI가 결과를 분석 중입니다...";
    try {
      const res = await fetch(`${API}/api/backtest/explain`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          ticker: d.ticker,
          name: d.ticker,
          base_year: d.base_year,
          end_year: d.end_year,
          hold_years: d.hold_years,
          predicted_grade: d.predicted_grade,
          actual_return_pct: d.actual_return_pct,
          score_detail: d.score_at_base_year,
          prediction_correct: d.prediction_correct,
        }),
      });
      const data = await res.json();
      txt.textContent = data.explanation || "설명을 가져올 수 없습니다.";
    } catch(e) {
      txt.textContent = "AI 설명 로드 실패: " + e.message;
    }
  }

  function renderMarketResult(d) {
    const gs = d.grade_summary;
    const gradeOrder = ["TENBAGGER", "COMPOUNDER", "WATCHLIST", "AVOID"];
    const gradeColors = { TENBAGGER: "#10b981", COMPOUNDER: "#60a5fa", WATCHLIST: "#fbbf24", AVOID: "#f87171" };
    const gradeEmoji = { TENBAGGER: "⭐", COMPOUNDER: "🟢", WATCHLIST: "🟡", AVOID: "🔴" };

    // 요약 배너
    const summaryHtml = `
      <div class="summary-banner">
        <h3>📊 ${d.base_year}년 기준 → ${d.base_year + d.hold_years}년 (${d.hold_years}년 보유) · ${d.total_companies}개 종목 분석</h3>
        <div class="grade-summary-grid">
          ${gradeOrder.map(g => {
            const s = gs[g];
            if (!s) return "";
            const ret = s.avg_return;
            const retStr = ret == null ? "-" : `${ret >= 0 ? "+" : ""}${ret.toFixed(0)}%`;
            return `
              <div class="grade-summary-card">
                <div class="gs-grade" style="color:${gradeColors[g]}">${gradeEmoji[g]} ${g} (${s.count}개)</div>
                <div class="gs-avg" style="color:${ret == null ? "#9ca3af" : ret >= 0 ? "#10b981" : "#ef4444"}">${retStr}</div>
                <div class="gs-tb">평균 수익률</div>
                <div class="gs-tb" style="margin-top:4px">텐배거 달성: <strong style="color:#10b981">${s.tenbagger_count}개</strong> (${s.tenbagger_rate}%)</div>
              </div>`;
          }).join("")}
        </div>
      </div>`;

    // 산점도 차트 데이터
    const scatterData = d.details
      .filter(r => r.score_at_base_year?.total_score != null && r.actual_return_pct != null)
      .map(r => ({
        x: r.score_at_base_year.total_score,
        y: r.actual_return_pct,
        label: r.ticker,
        grade: r.score_at_base_year.grade,
      }));

    const gradeDatasets = gradeOrder.map(g => ({
      label: g,
      data: scatterData.filter(p => p.grade === g).map(p => ({ x: p.x, y: p.y })),
      backgroundColor: gradeColors[g] + "99",
      pointRadius: 5,
    }));

    // 상세 테이블
    const tableRows = d.details.map(r => {
      const sc = r.score_at_base_year;
      const ret = r.actual_return_pct;
      const retStr = ret == null ? "-" : `${ret >= 0 ? "+" : ""}${ret.toFixed(1)}%`;
      const retClass = ret == null ? "" : ret >= 0 ? "pos" : "neg";
      return `<tr onclick="location.href='index.html?ticker=${r.ticker}'" style="cursor:pointer">
        <td><span style="font-weight:700">${r.ticker}</span></td>
        <td>${sc.total_score?.toFixed(1) ?? "-"}</td>
        <td><span class="grade-badge grade-${sc.grade}">${sc.grade}</span></td>
        <td class="${retClass}">${retStr}</td>
        <td>${r.price_at_base_year ? "₩" + r.price_at_base_year.toLocaleString() : "-"}</td>
        <td>${r.price_at_end_year ? "₩" + r.price_at_end_year.toLocaleString() : "-"}</td>
        <td>${r.is_tenbagger_actual ? "⭐ YES" : "-"}</td>
        <td>${r.prediction_correct == null ? "-" : r.prediction_correct ? "✅" : "❌"}</td>
      </tr>`;
    }).join("");

    document.getElementById("resultArea").innerHTML = summaryHtml + `
      <div class="chart-card">
        <h3>🎯 스코어 vs 실제 수익률 산점도 (X: ${d.base_year}년 스코어 / Y: 실제 수익률%)</h3>
        <canvas id="scatterChart" height="300"></canvas>
      </div>
      <div class="table-card">
        <h3>📋 종목별 상세 결과 (클릭 → 상세 분석)</h3>
        <table>
          <thead>
            <tr>
              <th style="text-align:left">종목</th>
              <th>당시 점수</th>
              <th>예측 등급</th>
              <th>실제 수익률</th>
              <th>${d.base_year}년 주가</th>
              <th>${d.base_year + d.hold_years}년 주가</th>
              <th>텐배거</th>
              <th>예측 적중</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>`;

    // 산점도 렌더링
    setTimeout(() => {
      const ctx = document.getElementById("scatterChart");
      if (!ctx) return;
      new Chart(ctx, {
        type: "scatter",
        data: { datasets: gradeDatasets },
        options: {
          responsive: true,
          plugins: {
            legend: { labels: { color: "#9ca3af", font: { size: 11 } } },
            tooltip: {
              callbacks: {
                label: (ctx) => `점수 ${ctx.parsed.x.toFixed(1)} / 수익률 ${ctx.parsed.y.toFixed(1)}%`
              }
            }
          },
          scales: {
            x: {
              title: { display: true, text: `${d.base_year}년 텐배거 스코어`, color: "#6b7280" },
              ticks: { color: "#6b7280" },
              grid: { color: "rgba(255,255,255,.05)" },
            },
            y: {
              title: { display: true, text: `${d.hold_years}년 실제 수익률 (%)`, color: "#6b7280" },
              ticks: { color: "#6b7280" },
              grid: { color: "rgba(255,255,255,.05)" },
            },
          },
        },
      });
    }, 100);
  }

  // ── URL 파라미터 처리 (index.html에서 링크로 올 때) ──
  window.addEventListener("load", () => {
    const params = new URLSearchParams(location.search);
    const ticker = params.get("ticker");
    if (ticker) {
      document.getElementById("btTicker").value = ticker;
    }
  });
</script>
</body>
</html>
