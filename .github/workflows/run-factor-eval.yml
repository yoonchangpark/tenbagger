name: Run Backfill + Factor Eval

# 자율 검증 파이프라인 — 백필 실행 → 완료까지 폴링 → 팩터 예측력(밴드×코호트×시장) 출력
# GitHub 러너가 Railway API를 호출하므로 사람이 Railway Console을 안 거쳐도 됨.
# 에이전트가 workflow_dispatch로 트리거하고 job 로그로 결과를 읽는다.
on:
  workflow_dispatch:
    inputs:
      base_years:
        description: "기준 연도 (쉼표구분)"
        required: false
        default: "2014,2015,2016,2017,2018,2019,2020"
      hold_years:
        description: "보유 기간 (년)"
        required: false
        default: "5"
      limit:
        description: "상위 N종목"
        required: false
        default: "1000"

jobs:
  backfill-and-eval:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ vars.TENBAGGER_API_BASE || 'https://tenbagger-production.up.railway.app' }}
    steps:
      - name: Trigger Backfill
        env:
          BASE_YEARS: ${{ inputs.base_years || '2014,2015,2016,2017,2018,2019,2020' }}
          HOLD_YEARS: ${{ inputs.hold_years || '5' }}
          LIMIT: ${{ inputs.limit || '1000' }}
        run: |
          echo "백필 트리거: $BASE (base_years=$BASE_YEARS hold=$HOLD_YEARS limit=$LIMIT)"
          enc=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['BASE_YEARS']))")
          code=$(curl -s -o resp.json -w "%{http_code}" \
            -X POST "$BASE/api/v2/accuracy/backfill?base_years=$enc&hold_years=$HOLD_YEARS&limit=$LIMIT")
          echo "HTTP $code"; cat resp.json; echo
          [ "$code" = "200" ] || { echo "::error::백필 트리거 실패 (HTTP $code)"; exit 1; }

      - name: Poll until completed
        run: |
          echo "완료까지 폴링 (최대 55분)..."
          for i in $(seq 1 110); do
            sleep 30
            result=$(curl -s "$BASE/api/v2/accuracy/backfill?hold_years=${{ inputs.hold_years || '5' }}")
            status=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin).get('progress',{}).get('status','unknown'))" 2>/dev/null)
            done=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin).get('progress',{}).get('done',0))" 2>/dev/null)
            total=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin).get('progress',{}).get('total',0))" 2>/dev/null)
            echo "[$i/110] status=$status done=$done/$total"
            [ "$status" = "completed" ] && { echo "백필 완료"; exit 0; }
            [ "$status" = "error" ] && { echo "::error::백필 오류"; echo "$result"; exit 1; }
          done
          echo "::warning::55분 내 미완료 — Railway에서 계속 실행 중일 수 있음"

      - name: Factor Eval (momentum / discovery / quality)
        if: always()
        run: |
          HY=${{ inputs.hold_years || '5' }}
          for score in momentum discovery quality; do
            echo "======== FACTOR: $score (hold=$HY) ========"
            curl -s "$BASE/api/v2/accuracy/factor-eval?score=$score&hold_years=$HY" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if 'error' in d: print(d['error']); sys.exit()
          print('밴드    표본   중간수익률')
          for b in d.get('bands', []):
              print(f\"{b['band']:7} {b['count']:5}  {b['median_pct']}%\")
          print('연도  상위표본  상위중간  시장중간  (알파)')
          for c in d.get('cohorts', []):
              tm, mm = c['top_median'], c['market_median']
              alpha = (round(tm-mm,1) if tm is not None and mm is not None else None)
              print(f\"{c['base_year']}   n={c['n_top']:<3}    {tm}%    {mm}%   {alpha}\")
          "
          done
